[package]
name = "c2x"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
futures-util = "0.3.34"
prost = "0.14.4"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["time"] }
toml = "1.1.8"
tonic = "0.14.8"
tonic-prost = "0.14.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.8"
